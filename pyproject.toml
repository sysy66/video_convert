[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-convert"
version = "0.1.0"
description = "视频批量转码与质量评估工具"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.coverage.run]
source = ["src", "main.py"]

[tool.coverage.report]
fail_under = 69

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--benchmark-disable"]
markers = [
    "unit: 单元测试，不依赖真实 ffmpeg/ffprobe",
    "integration: 集成测试，调用真实 ffmpeg/ffprobe",
    "slow: 耗时测试，默认排除（pytest --run-slow 启用）",
    "regression: 回归锁定测试（fixtures 哈希、确定性重编码）",
]
